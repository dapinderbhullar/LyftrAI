services:
  - type: web
    name: lyftr-chat-api
    runtime: docker
    rootDir: backend
    plan: free
    numInstances: 1
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: GEMINI_API_KEYS
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: lyftr-chat-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
